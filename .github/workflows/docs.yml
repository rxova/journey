name: Docs Check

# Docs are published as part of rxova.org (the rxova/rxova-website aggregator),
# not from this repo's Pages. On a push to main we build to catch breakage and
# then notify the aggregator; release.yml also dispatches, but only on a version
# commit, and a docs-only change deserves to reach the site without waiting for
# the next release.
on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "apps/devtools/**"
      - "packages/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "apps/devtools/**"
      - "packages/**"
      - "README.md"
      - "CHANGELOG.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "vitest.config.ts"
      - "eslint.config.js"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Pin pnpm
        run: corepack prepare pnpm@10.30.3+sha512.c961d1e0a2d8e354ecaa5166b822516668b7f44cb5bd95122d590dd81922f606f5473b6d23ec4a5be05e7fcd18e8488d47d978bbe981872f1145d06e9a740017 --activate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check public API TSDoc coverage
        run: pnpm run docs:api:check

      - name: Build docs
        run: pnpm run docs:check

      # Build a second time at the path the aggregator actually mounts these
      # docs at. Absolute references that only work at the domain root — CSS
      # url(), raw <a href>, hardcoded <img src> — are invisible in the build
      # above and break silently once deployed. Since onBrokenLinks is 'throw',
      # catching them here turns a red rxova.org deploy (which blocks every
      # project on the site, not just this one) into a failed PR check.
      - name: Build docs at the aggregator base path
        env:
          DOCS_URL: https://rxova.org
          DOCS_BASE_URL: /packages/journey/
        run: pnpm run docs:check

  notify-website:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rxova.org rebuild
        # Never fail the workflow over the dispatch: the docs build is the
        # signal, and a missing token should not read as broken docs.
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.AGGREGATOR_DISPATCH_TOKEN }}
          repository: rxova/rxova-website
          event-type: docs-journey
          client-payload: '{"ref": "${{ github.sha }}"}'
