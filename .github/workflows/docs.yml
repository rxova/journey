name: Docs Check

# Docs are published as part of rxova.org (the rxova/rxova-website aggregator),
# not from this repo's Pages. The aggregator does not build them: this workflow
# builds the dist for /packages/journey/, uploads it as the `docs-dist`
# artifact, and dispatches a `docs` event naming this run — gate 1 of the
# contract in rxova/rxova-website docs/INPUTS-CONTRACT.md. rxova.org validates
# what arrives, persists it, and republishes; a rejection leaves the live site
# untouched.
#
# This is the only sender in the repo. release.yml used to dispatch as well, on
# a version commit; under the contract a dispatch has to name a run that holds a
# docs-dist artifact, and the release run holds no such thing. The version
# commit is itself a push to main touching packages/**, so it triggers this
# workflow and the release's docs reach the site through the same path as every
# other change.
on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Serialised rather than cancelled: two quick merges to main would otherwise
# race, and the aggregator would be dispatched twice for builds that finished
# out of order. cancel-in-progress: false because the dispatch is the point —
# killing a run mid-flight can drop the notification entirely.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile

      # `astro check` over the site's own .astro/.mdx sources. Cheap, and it
      # fails on a broken component prop before the slower build does.
      - name: Typecheck docs
        run: pnpm exec turbo run typecheck --filter=@rxova/journey-docs

      # Build at the path the aggregator actually mounts these docs at.
      # Absolute references that only work at the domain root — a hardcoded
      # href, an <img src>, a hero action link — are invisible in a root build
      # and break silently once deployed. starlight-links-validator runs as part
      # of the build and fails on any broken internal link, so catching them
      # here turns a red rxova.org deploy (which blocks every project on the
      # site, not just this one) into a failed PR check.
      #
      # Only the base-path build runs here: the root-path build is what the
      # `checks` job in ci.yml already does as part of `turbo run build`, so
      # repeating it would be the same work twice.
      - name: Build docs at the aggregator base path
        env:
          DOCS_URL: https://rxova.org
          DOCS_BASE_URL: /packages/journey/
        run: pnpm run docs:build

      - name: Mark the page-component bundle
        run: node --import tsx apps/docs/scripts/write-page-bundle.ts

      # The dist the aggregator will compose into its shell. `docs-dist` is the fixed
      # artifact name in the contract — ingest.yml downloads it by that name from
      # this run — so it is not ours to rename. Pointing `path` at the dist
      # directory (not its parent) is what puts index.html at the artifact root,
      # which is gate 2b's check.
      #
      # Uploaded on pull requests too: the artifact is then the reviewable
      # output of the check, and an empty dist fails here rather than at ingest.
      - name: Upload docs-dist
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/docs/dist
          if-no-files-found: error

  # Gate 1 of the docs pipeline: tell rxova.org that this run holds a dist built
  # for /packages/journey/. The aggregator validates the payload, downloads the
  # artifact above, and persists + publishes it — it never builds these docs
  # itself. Contract: rxova/rxova-website docs/INPUTS-CONTRACT.md.
  notify-website:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs ingest to rxova.org
        # No continue-on-error, unlike the pre-contract dispatch this replaces.
        # Back then the aggregator rebuilt the docs from source on its own
        # schedule, so a dropped notification only delayed a publish. Now the
        # dispatch *is* the publish: swallowing a failure would leave the site
        # serving stale docs with a green tick here and nothing to look at.
        env:
          GH_TOKEN: ${{ secrets.AGGREGATOR_DISPATCH_TOKEN }}
        # `-F` only for schema, which the receiver compares as the number 2;
        # everything else goes through `-f` so it stays a string, and an
        # all-digit ref or sha cannot arrive as a number.
        run: |
          gh api repos/rxova/rxova-website/dispatches \
            -f event_type=docs \
            -F 'client_payload[schema]=2' \
            -f 'client_payload[project]=journey' \
            -f "client_payload[ref]=${GITHUB_REF_NAME}" \
            -f "client_payload[sha]=${GITHUB_SHA}" \
            -f "client_payload[run_id]=${GITHUB_RUN_ID}" \
            -f 'client_payload[base]=/packages/journey/' \
            -f 'client_payload[framework]=astro'
