name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'skip-changeset') }}" == "true" ]]; then
            echo "skip-changeset label present; skipping changeset check."
            exit 0
          fi

          if echo "$CHANGED_FILES" | grep -qE '^(docs/|\\.github/|\\.changeset/|.*\\.md$|.*\\.txt$|.*\\.yml$|.*\\.yaml$|.*\\.json$)'; then
            if ! echo "$CHANGED_FILES" | grep -qE '^packages/(core|react)/'; then
              echo "Docs/CI/config-only changes detected; skipping changeset check."
              exit 0
            fi
          fi

          if echo "$CHANGED_FILES" | grep -qE '^\\.changeset/.*\\.md$'; then
            echo "Changeset found."
            exit 0
          fi

          echo "No changeset found. Add one with 'pnpm changeset' or apply the 'skip-changeset' label."
          exit 1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - run: corepack prepare pnpm@10.29.3+sha512.498e1fb4cca5aa06c1dcf2611e6fafc50972ffe7189998c409e90de74566444298ffe43e6cd2acdc775ba1aa7cc5e092a8b7054c811ba8c5770f84693d33d2dc --activate
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run packaging:check
      - run: pnpm run pack:smoke
      - name: Add coverage summary
        if: always() && matrix.node-version == 24
        run: node ./scripts/coverage-summary.mjs
      - name: Upload coverage report
        if: always() && matrix.node-version == 24
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage
      - run: pnpm run size:check
