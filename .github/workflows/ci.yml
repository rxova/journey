name: CI

# Every job is a reusable workflow from rxova/shared, called at @main. What
# stays here is the graph: which jobs run, and when. The steps are the ones
# `pnpm run verify` runs, and the pre-push hook runs that end to end, so a green
# push is a green pipeline.
#
# Release is gated on this workflow succeeding for the commit being released,
# so a push to main that skipped CI would never publish.

on:
  push:
    branches: [main]
  pull_request:
    # No `edited`: the title check lives in pr-title.yml. `labeled`/`unlabeled`
    # re-run the changeset gate, whose escape hatch is the `skip-changeset` label.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# Superseded pull request runs are cancelled; main runs always finish, because
# Release reads this workflow's conclusion to decide whether to publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The root of the graph: commitlint over the range, then `check-scope`, whose
  # outputs let a documentation-only or release-bookkeeping range skip the rest.
  commitlint:
    name: commit messages
    uses: rxova/shared/.github/workflows/commit-messages.yml@main

  # Unlike the sibling rxova repos, the docs site is NOT left out of the build:
  # journey's Starlight site renders no mermaid, so it needs no headless
  # chromium and builds here like any other workspace, the devtools extension
  # included. That is also why this job runs on a range that only touched the
  # docs site (`docs-changed`).
  checks:
    name: lint · format · types · build
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true' || needs.commitlint.outputs.docs-changed == 'true'
    uses: rxova/shared/.github/workflows/repo-checks.yml@main
    with:
      extra-command: >-
        pnpm run version:major:check &&
        pnpm run changeset:overrides:check &&
        pnpm run docs:banned:check &&
        pnpm exec turbo run docs:api:check docs:release-notes:check //#typecheck:scripts
      build-command: pnpm exec turbo run build size check:exports

  # Each package's suite with its per-file coverage gate, plus the repository's
  # own scripts: `pnpm test`.
  test:
    name: unit
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/unit-tests.yml@main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  supply-chain:
    name: audit · sherif · knip · dedupe
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/supply-chain.yml@main

  package:
    name: package contract
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/package-contract.yml@main

  # The packages declare Node >= 20.11, but pnpm needs >= 22.13 to install, so
  # the floor is exercised against the real tarballs with plain `node`.
  compat:
    name: published packages on the engines floor
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/node-floor-smoke.yml@main

  # The peer range allows React 18.2, but the lockfile only ever installs 19, so
  # without this the minimum supported version is an untested claim. React is
  # pinned at the root as well as in packages/react: @rxova/ts-utils is declared
  # at the root, so its `react` peer resolves there, and pinning only the package
  # would leave the inlined `useIsomorphicLayoutEffect` on React 19 while the
  # suite renders with 18 — two Reacts, and every hook call fails. The coverage
  # gate is the regular suite's job; this one only asks whether 18.2 works.
  react-minimum-version:
    name: unit (react 18.2)
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/react-minimum-version.yml@main
    with:
      react-version: 18.2.0
      types-version: 18.3.27
      types-dom-version: 18.3.7
      filters: "@rxova/journey-react"
      node-version: "22"
      test-command: pnpm --filter @rxova/journey-react exec vitest run --coverage.enabled=false
      typecheck-command: pnpm --filter @rxova/journey-react typecheck

  docs-checks:
    name: docs checks
    needs: [commitlint]
    if: needs.commitlint.outputs.docs-only == 'true'
    uses: rxova/shared/.github/workflows/docs-checks.yml@main
    with:
      command: pnpm run format:check && pnpm run docs:banned:check

  # Each changeset must name exactly one package
  # (`repoConfig.changeset.singlePackage` in the root package.json).
  changeset:
    name: changeset present
    needs: [commitlint]
    uses: rxova/shared/.github/workflows/changeset-gate.yml@main

  # The one context branch protection requires. `skipped` passes; `failure`
  # and `cancelled` do not. A job added above has to be added to `needs` here
  # too, or nothing requires it.
  all-checks:
    name: all checks
    if: always()
    needs:
      [
        commitlint,
        checks,
        test,
        supply-chain,
        package,
        compat,
        react-minimum-version,
        docs-checks,
        changeset,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: rxova/shared/actions/require-jobs@main
        with:
          needs: ${{ toJSON(needs) }}
