name: Publish Devtools To Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish after upload"
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      publish:
        description: "Publish after upload"
        required: false
        default: true
        type: boolean

concurrency:
  group: devtools-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Pin pnpm
        run: corepack prepare pnpm@10.30.3+sha512.c961d1e0a2d8e354ecaa5166b822516668b7f44cb5bd95122d590dd81922f606f5473b6d23ec4a5be05e7fcd18e8488d47d978bbe981872f1145d06e9a740017 --activate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate publish secrets
        if: inputs.publish == true
        run: |
          test -n "$CWS_PUBLISHER_ID"
          test -n "$CWS_EXTENSION_ID"
          test -n "$CWS_CLIENT_ID"
          test -n "$CWS_CLIENT_SECRET"
          test -n "$CWS_REFRESH_TOKEN"

      - name: Build extension
        run: pnpm --filter apps-devtools build

      - name: Pack extension zip
        run: |
          cd apps/devtools/dist
          zip -r ../../../apps-devtools.zip .

      - name: Publish to Chrome Web Store
        if: inputs.publish == true
        env:
          ZIP_FILE_PATH: apps-devtools.zip
        run: node --import tsx ./packages/common/tooling/publish-devtools.ts

      - name: Upload packaged zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: apps-devtools-upload-zip
          path: apps-devtools.zip
