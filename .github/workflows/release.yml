name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - run: corepack prepare pnpm@10.30.3+sha512.c961d1e0a2d8e354ecaa5166b822516668b7f44cb5bd95122d590dd81922f606f5473b6d23ec4a5be05e7fcd18e8488d47d978bbe981872f1145d06e9a740017 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Verify release surfaces
        run: pnpm run release:verify
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm run changeset:version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  check-devtools:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Check if devtools version changed
        id: check
        run: |
          if git diff HEAD~1 HEAD -- apps/devtools/package.json | grep -q '"version"'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish-devtools:
    needs: check-devtools
    if: needs.check-devtools.outputs.changed == 'true'
    uses: ./.github/workflows/devtools-publish.yml
    with:
      publish: true
    secrets: inherit

  # Docs are published as part of rxova.org (the rxova/rxova-website aggregator),
  # not from this repo. On a release, notify the aggregator to rebuild instead of
  # deploying our own GitHub Pages site. Requires secret AGGREGATOR_DISPATCH_TOKEN
  # (a fine-grained PAT with Contents: write on rxova/rxova-website).
  notify-website:
    needs: release
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Version Packages')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rxova.org rebuild
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.AGGREGATOR_DISPATCH_TOKEN }}
          repository: rxova/rxova-website
          event-type: docs-journey
          client-payload: '{"ref": "${{ github.sha }}"}'
