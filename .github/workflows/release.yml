name: Release

# Runs only after CI has gone green on main. This used to trigger on the same
# `push: main` as ci.yml and then re-run the whole gate itself via
# `pnpm run verify` — so every merge ran the entire suite twice, concurrently,
# on the same commit. Gating on CI's conclusion gives the same guarantee ("a
# push to main cannot publish something a PR would have been blocked on") for
# half the work, and matches rxova/brand, rxova/react-inputs and
# rxova/use-everywhere.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Was missing entirely: two merges landing close together could run the
# changesets action concurrently, racing on the version commit and the tags.
concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    # workflow_run fires on both success and failure, so the conclusion has to
    # be checked explicitly. A manual dispatch has no upstream run to gate on.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      # The changesets action makes a version commit, which would otherwise fire
      # the pre-commit hook and run the workspace typecheck and test suite
      # against a generated bump. CI already gated this code on the PR.
      HUSKY: "0"
    permissions:
      contents: write # version commit and tags
      pull-requests: write # the version PR
      id-token: write # npm trusted publishing (OIDC provenance)
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out main by name (not the workflow_run's detached SHA) so the
          # changesets action knows its base branch when opening the version PR.
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          registry-url: "https://registry.npmjs.org"
      - uses: ./.github/actions/turbo-cache
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Create Release PR or Publish
        uses: changesets/action@v2
        with:
          # v2 renamed every one of these inputs. The old names were accepted
          # silently as "unexpected input" warnings, so the action ran with its
          # defaults instead — including the "Version Packages" commit subject
          # that commitlint rejects.
          version-script: pnpm run changeset:version
          publish-script: pnpm run release
          # Conventional, and not optional: commitlint is now the root job of
          # CI and runs `--last` on every push to main, so the action's default
          # "Version Packages" subject would fail the whole workflow on the one
          # commit that must not be blocked. Matches the sibling repos.
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  check-devtools:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # By name, matching the release job: under workflow_run the default
          # ref is not guaranteed to be the branch this released from.
          ref: main
          fetch-depth: 2
      - name: Check if devtools version changed
        id: check
        run: |
          if git diff HEAD~1 HEAD -- apps/devtools/package.json | grep -q '"version"'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish-devtools:
    needs: check-devtools
    if: needs.check-devtools.outputs.changed == 'true'
    uses: ./.github/workflows/devtools-publish.yml
    with:
      publish: true
    secrets: inherit

# No docs dispatch here any more. Under the rxova.org ingest contract
# (rxova/rxova-website docs/INPUTS-CONTRACT.md) a `docs` dispatch names the run
# holding a `docs-dist` artifact, and this run has none — it publishes packages,
# it does not build the site. Rebuilding the docs a second time here just to
# satisfy that would duplicate what docs.yml already does on the same commit:
# the "chore: version packages" commit is a push to main touching packages/**,
# so docs.yml builds and sends the released docs on its own.
