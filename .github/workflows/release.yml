name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm
        with:
          registry-url: "https://registry.npmjs.org"
      - uses: ./.github/actions/turbo-cache
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      # The same gate the pre-push hook runs, replacing the `release:verify`
      # chain of twelve sequential `pnpm run`s. One definition, in
      # scripts/verify.js, so the local hook and the release gate cannot drift.
      # It also adds two checks `release:verify` never had: the dependency audit
      # and the dedupe check.
      - name: Verify release surfaces
        run: pnpm run verify
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm run changeset:version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  check-devtools:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Check if devtools version changed
        id: check
        run: |
          if git diff HEAD~1 HEAD -- apps/devtools/package.json | grep -q '"version"'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish-devtools:
    needs: check-devtools
    if: needs.check-devtools.outputs.changed == 'true'
    uses: ./.github/workflows/devtools-publish.yml
    with:
      publish: true
    secrets: inherit

  # Docs are published as part of rxova.org (the rxova/rxova-website aggregator),
  # not from this repo. On a release, notify the aggregator to rebuild instead of
  # deploying our own GitHub Pages site. Requires secret AGGREGATOR_DISPATCH_TOKEN
  # (a fine-grained PAT with Contents: write on rxova/rxova-website).
  notify-website:
    needs: release
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Version Packages')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rxova.org rebuild
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.AGGREGATOR_DISPATCH_TOKEN }}
          repository: rxova/rxova-website
          event-type: docs-journey
          client-payload: '{"ref": "${{ github.sha }}"}'
