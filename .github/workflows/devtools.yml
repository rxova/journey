name: Build Devtools Artifact

on:
  push:
    branches: [main]
    paths:
      - "apps/devtools/**"
      - "packages/devtools-bridge/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "vitest.config.ts"
      - "eslint.config.js"
      - ".github/workflows/devtools.yml"
  workflow_dispatch:

concurrency:
  group: devtools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck devtools app
        run: pnpm --filter apps-devtools typecheck

      - name: Run devtools tests
        run: pnpm --filter apps-devtools test -- --run apps/devtools/test

      - name: Build devtools extension
        run: pnpm --filter apps-devtools build

      - name: Archive extension bundle
        run: |
          tar -czf apps-devtools-dist.tgz -C apps/devtools dist

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: apps-devtools-dist
          path: apps-devtools-dist.tgz
