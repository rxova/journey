name: Build Devtools Artifact

on:
  push:
    branches: [main]
    paths:
      - "apps/devtools/**"
      - "packages/devtools-bridge/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "vitest.config.ts"
      - "eslint.config.js"
      - ".github/workflows/devtools.yml"
  workflow_dispatch:

concurrency:
  group: devtools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Temporarily disabled in this branch until the approval process completes.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Pin pnpm
        run: corepack prepare pnpm@10.32.0+sha512.9b2634bb3fed5601c33633f2d92593f506270a3963b8c51d2b2d6a828da615ce4e9deebef9614ccebbc13ac8d3c0f9c9ccceb583c69c8578436fa477dbb20d70 --activate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck devtools app
        run: pnpm --filter apps-devtools typecheck

      - name: Run devtools tests
        run: pnpm --filter apps-devtools test -- --run apps/devtools/test

      - name: Build devtools extension
        run: pnpm --filter apps-devtools build

      - name: Install Playwright Chromium
        run: pnpm --filter apps-devtools exec playwright install --with-deps chromium

      - name: Run browser integration tests
        run: xvfb-run -a pnpm --filter apps-devtools test:browser -- --reporter=line

      - name: Upload browser integration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apps-devtools-browser-artifacts
          path: |
            apps/devtools/test-results
            apps/devtools/playwright-report
          if-no-files-found: ignore

      - name: Archive extension bundle
        run: |
          tar -czf apps-devtools-dist.tgz -C apps/devtools dist

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: apps-devtools-dist
          path: apps-devtools-dist.tgz
