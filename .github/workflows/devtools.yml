name: Build Devtools Artifact

on:
  push:
    branches: [main]
    paths:
      - "apps/devtools/**"
      - "packages/devtools-bridge/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "vitest.config.ts"
      - "eslint.config.js"
      - ".github/workflows/devtools.yml"
  workflow_dispatch:

concurrency:
  group: devtools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      - uses: ./.github/actions/turbo-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only the build, and through Turbo rather than `pnpm --filter`. This job
      # used to typecheck and test the extension too, but ci.yml's `checks` job
      # already covers both — `apps-devtools#typecheck` rides the workspace
      # typecheck, and the suite is the root `//#test` task, whose inputs
      # include apps/devtools/test. Running them here as well was the same work
      # twice, with no cache, on every push touching the extension.
      #
      # What this workflow uniquely provides is the downloadable artifact, so
      # that is all it does now. Turbo replays the build from cache when nothing
      # feeding it changed.
      - name: Build devtools extension
        run: pnpm exec turbo run build --filter=apps-devtools

      - name: Archive extension bundle
        run: |
          tar -czf apps-devtools-dist.tgz -C apps/devtools dist

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: apps-devtools-dist
          path: apps-devtools-dist.tgz
