name: Build Devtools Artifact

on:
  push:
    branches: [main]
    paths:
      - "apps/devtools/**"
      - "packages/devtools-bridge/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - "vitest.config.ts"
      - "eslint.config.js"
      - ".github/workflows/devtools.yml"
  workflow_dispatch:

concurrency:
  group: devtools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Temporarily disabled in this branch until the approval process completes.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Pin pnpm
        run: corepack prepare pnpm@10.30.3+sha512.c961d1e0a2d8e354ecaa5166b822516668b7f44cb5bd95122d590dd81922f606f5473b6d23ec4a5be05e7fcd18e8488d47d978bbe981872f1145d06e9a740017 --activate

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck devtools app
        run: pnpm --filter apps-devtools typecheck

      - name: Run devtools tests
        run: pnpm --filter apps-devtools test -- --run apps/devtools/test

      - name: Build devtools extension
        run: pnpm --filter apps-devtools build

      - name: Install Playwright Chromium
        run: pnpm --filter apps-devtools exec playwright install --with-deps chromium

      - name: Run browser integration tests
        run: xvfb-run -a pnpm --filter apps-devtools test:browser -- --reporter=line

      - name: Upload browser integration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apps-devtools-browser-artifacts
          path: |
            apps/devtools/test-results
            apps/devtools/playwright-report
          if-no-files-found: ignore

      - name: Archive extension bundle
        run: |
          tar -czf apps-devtools-dist.tgz -C apps/devtools dist

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: apps-devtools-dist
          path: apps-devtools-dist.tgz
