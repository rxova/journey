name: Setup pnpm
description: Enable Corepack, pin pnpm, and configure Node.js caching.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "24"
  registry-url:
    description: Optional package registry URL for publishing jobs.
    required: false
    default: ""
  cache-dependency-path:
    description: Lockfile path used by setup-node for dependency caching.
    required: false
    default: pnpm-lock.yaml

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Pin pnpm
      shell: bash
      run: corepack prepare pnpm@11.4.0+sha512.f0febc7e37552ab485494a914241b338e0b3580b93d54ce31f00933015880863129038a1b4ae4e414a0ee63ac35bf21197e990172c4a68256450b5636310968f --activate

    - name: Setup Node
      if: ${{ inputs['registry-url'] == '' }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs['node-version'] }}
        cache: pnpm
        cache-dependency-path: ${{ inputs['cache-dependency-path'] }}

    - name: Setup Node With Registry
      if: ${{ inputs['registry-url'] != '' }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs['node-version'] }}
        registry-url: ${{ inputs['registry-url'] }}
        cache: pnpm
        cache-dependency-path: ${{ inputs['cache-dependency-path'] }}

    - name: Report pnpm version
      shell: bash
      run: pnpm --version
