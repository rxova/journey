version: 2
updates:
  # Workspace dependencies (every package.json + pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One consolidated PR per week instead of a stream of single-dependency ones.
    open-pull-requests-limit: 1
    # `skip-changeset` is what the changeset gate reads: a bump changes what the
    # repository builds with, not what it publishes, so there is no changelog
    # entry to write.
    labels: ["dependencies", "skip-changeset"]
    # `chore(deps): …` — the PR title is linted by commitlint.
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Everything — prod and dev — lands in a single PR.
      all-dependencies:
        applies-to: version-updates
        patterns: ["*"]
      # Security fixes are grouped too, so an advisory batch is also one PR.
      all-dependencies-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Hold TypeScript 7: the native rewrite breaks typescript-eslint and the
      # declaration build. Earlier majors, minors and patches still come through.
      - dependency-name: typescript
        versions: [">=7"]
  # The Actions pinned in .github/workflows and .github/actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels: ["dependencies", "skip-changeset"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      all-actions:
        applies-to: version-updates
        patterns: ["*"]
      all-actions-security:
        applies-to: security-updates
        patterns: ["*"]
