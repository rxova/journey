name: "Bug report"
description: "Report a reproducible problem in Rxova Journey."
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the details below.
  - type: input
    id: version
    attributes:
      label: Package version(s)
      description: "Which package and version are you using? (e.g. @rxova/journey-core@0.1.0, @rxova/journey-react@0.1.0)"
      placeholder: "@rxova/journey-core@x.y.z"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: "Where does this bug happen?"
      options:
        - Node.js
        - Browser
        - SSR / RSC
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: "A clear and concise description of the bug."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: "Provide steps or a minimal reproduction repo."
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "What actually happened? Include logs/errors if relevant."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "OS, Node.js version, framework version, bundler, etc."
      placeholder: |
        OS:
        Node:
        Framework:
        Bundler:
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I can provide a minimal reproduction.
          required: false
