<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Journey Devtools panel overview screenshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5efe6" />
      <stop offset="100%" stop-color="#e4eef5" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="70" y="60" width="1460" height="780" rx="20" fill="#fff" stroke="#d5dde4"/>
  <text x="120" y="120" font-size="34" font-family="IBM Plex Sans, Arial" fill="#162530">Rxova Journey Devtools</text>
  <text x="120" y="155" font-size="20" font-family="IBM Plex Sans, Arial" fill="#5e6d78">Inspect machines, watch snapshots, and trigger events in real time.</text>

  <rect x="120" y="190" width="1360" height="90" rx="12" fill="#ffffff" stroke="#d5dde4"/>
  <text x="150" y="235" font-size="23" font-family="IBM Plex Sans, Arial" fill="#162530">Connection</text>
  <text x="150" y="262" font-size="18" font-family="IBM Plex Sans, Arial" fill="#0f8f6a">Connected to inspected tab</text>

  <rect x="120" y="300" width="430" height="500" rx="12" fill="#fff" stroke="#d5dde4"/>
  <text x="150" y="345" font-size="23" font-family="IBM Plex Sans, Arial" fill="#162530">Machines</text>
  <rect x="150" y="370" width="370" height="44" rx="8" fill="#f8fbfd" stroke="#d5dde4"/>
  <text x="165" y="398" font-size="18" font-family="IBM Plex Sans, Arial" fill="#162530">Checkout Flow (Storefront)</text>
  <rect x="150" y="430" width="370" height="44" rx="8" fill="#f8fbfd" stroke="#d5dde4"/>
  <text x="165" y="458" font-size="18" font-family="IBM Plex Sans, Arial" fill="#5e6d78">Profile Completion (Dashboard)</text>

  <rect x="570" y="300" width="910" height="500" rx="12" fill="#fff" stroke="#d5dde4"/>
  <text x="600" y="345" font-size="23" font-family="IBM Plex Sans, Arial" fill="#162530">Snapshot</text>
  <rect x="600" y="368" width="170" height="36" rx="8" fill="#d8f3ea" stroke="#0f8f6a"/>
  <text x="620" y="392" font-size="16" font-family="IBM Plex Sans, Arial" fill="#162530">Current/Status</text>
  <rect x="782" y="368" width="100" height="36" rx="8" fill="#fff" stroke="#d5dde4"/>
  <text x="808" y="392" font-size="16" font-family="IBM Plex Sans, Arial" fill="#162530">Context</text>
  <rect x="894" y="368" width="100" height="36" rx="8" fill="#fff" stroke="#d5dde4"/>
  <text x="924" y="392" font-size="16" font-family="IBM Plex Sans, Arial" fill="#162530">History</text>
  <rect x="600" y="420" width="850" height="340" rx="10" fill="#f8fbfd" stroke="#d5dde4"/>
  <text x="630" y="465" font-size="20" font-family="JetBrains Mono, monospace" fill="#162530">{</text>
  <text x="650" y="500" font-size="20" font-family="JetBrains Mono, monospace" fill="#162530">"current": "review",</text>
  <text x="650" y="535" font-size="20" font-family="JetBrains Mono, monospace" fill="#162530">"status": "running",</text>
  <text x="650" y="570" font-size="20" font-family="JetBrains Mono, monospace" fill="#162530">"isLoading": false</text>
  <text x="630" y="605" font-size="20" font-family="JetBrains Mono, monospace" fill="#162530">}</text>
</svg>
