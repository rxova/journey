packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"

overrides:
  # No exact `svgo` pin. There used to be `svgo: 3.3.3`, which silently defeated
  # the `svgo@>=3.0.0 <3.3.4` range override below — an exact pin wins, so the
  # range that exists to force >=3.3.4 never applied and the tree resolved to the
  # vulnerable 3.3.3 (GHSA-2p49-hgcm-8545, removeScripts leaves some executable
  # scripts intact). Latent under Docusaurus; live once Astro started pulling
  # svgo, and only visible because `pnpm audit` works again on pnpm 11.
  jsdom>undici: ">=7.30.1 <8.0.0"
  cheerio>undici: ">=7.30.1 <8.0.0"
  "@crxjs/vite-plugin>rollup": 2.80.0
  "picomatch@<2.3.2": ">=2.3.2 <3.0.0"
  "picomatch@>=4.0.0 <4.0.4": ">=4.0.4 <5.0.0"
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1 <0.29.0"
  "@babel/core@<=7.29.0": ">=7.29.6 <8.0.0"
  "brace-expansion@<1.1.16": ">=1.1.16 <2.0.0"
  "svgo@>=3.0.0 <3.3.4": ">=3.3.4 <4.0.0"
  # GHSA-r28c-9q8g-f849, disclosed after the range above was written and
  # not covered by it: postcss <=8.5.17 auto-loads a previous source map
  # from sourceMappingURL, so a crafted CSS comment can disclose any .map
  # file. Reached only through the docs site
  # (@astrojs/starlight > astro-expressive-code > ... > postcss), 24 paths.
  "postcss@<=8.5.17": ">=8.5.18 <9.0.0"
  # GHSA-q8gj-x3r6-9xjr (critical): `quote()` lets a line terminator in a token
  # after a `{ comment }` token inject a second command. The only path is
  # @changesets/cli > launch-editor > shell-quote, which runs when changesets
  # opens an editor on this repository's own input. @changesets/cli declares
  # `^1.8.4`, so no bump reaches it.
  "shell-quote@<1.11.0": ">=1.11.0 <2.0.0"
  # GHSA-8mjh-66w6-rj3q and companions: the `fs.existsSync()` guard before the
  # editor spawn is bypassable on Windows. Same @changesets/cli path, and
  # @changesets/cli has no release that raises its `^2.6.1`.
  "launch-editor@<2.14.2": ">=2.14.2 <3.0.0"
  # GHSA-gfr2-rv44-r23c: a single multi-line link reference definition renders
  # in quadratic time. Reached through typedoc, rendering the TSDoc in this
  # repository. Scoped to the 14.x line typedoc asks for.
  "markdown-it@<14.3.3": ">=14.3.3 <15.0.0"
  # GHSA-w02v-q2wq-9vqm: quadratic backtracking on an attacker-controlled
  # selector. Reached only through the docs site's expressive-code chain >
  # postcss-nested, parsing expressive-code's own selectors at build time.
  "postcss-selector-parser@<7.1.6": ">=7.1.6 <8.0.0"
  # This replaced a `>=7.0.0 <=7.3.4` pin that went stale the way the postcss
  # and fast-uri entries did: the advisory's patched floor moved to 7.3.7. It
  # covers the 7.x copy that vitest still resolves (vitest > @vitest/mocker >
  # vite); the examples are on vite 8 and are not matched by this key.
  "vite@<7.3.7": ">=7.3.7 <8.0.0"
  # Not an advisory. @rxova/ts-utils 0.3.0 split its exports and the new
  # `./react` subpath gave the package a `react` peer. The root workspace
  # declares ts-utils but no react of its own, so pnpm satisfied that peer with
  # a 19.3.0 copy nothing else asks for while every package resolves 19.3.1.
  # Two copies of React in one tree, and the whole @rxova/journey-react suite
  # failed on it. Scoped to the 19 line so a React 18 consumer tree — the
  # published peer is `>=18.2.0` — is not forced forward.
  "react@>=19.0.0 <19.3.1": ">=19.3.1 <20.0.0"
  "react-dom@>=19.0.0 <19.3.1": ">=19.3.1 <20.0.0"
  # GHSA-5p4m-2wfm-xmqj: `!!omap` resolution is quadratic in the number of keys, so
  # a hostile YAML document costs CPU out of proportion to its size. It lands on
  # both live majors — the 3.x line through @manypkg's read-yaml-file under
  # changesets, the 4.x line through changesets, commitlint's cosmiconfig and
  # Astro's markdown pipeline. Every consumer here parses YAML this repo owns
  # (frontmatter, changesets, commitlint config), but `audit:check` gates on high.
  #
  # Pinned per-major because the 3.x consumers still call the pre-4.0 API, so a
  # single `>=4.3.1` would break them rather than patch them. Both bounds closed:
  # an open `>=3.15.1` resolves to 5.x.
  #
  # The floors were 3.15.0 and 4.3.0, which is where the advisory's patched ranges
  # started when these entries were written. Upstream has since widened both by one
  # patch, so the pins that fixed this went stale without any file here changing and
  # the gate went red on a commit that touched nothing related.
  "js-yaml@>=3.0.0 <3.15.1": ">=3.15.1 <4.0.0"
  "js-yaml@>=4.0.0 <4.3.1": ">=4.3.1 <5.0.0"

  # GHSA-2v37-7h3g-55p8 / GHSA-28wg-ghj8-5hjv: nanoid's fill loop never terminates
  # when a custom generator is handed a size of zero, and the non-secure generators
  # loop on a negative size. Two advisories, two live majors, and nothing in this
  # repo lets a caller near either generator: the 3.x line arrives under postcss
  # (vitest's Vite, Astro's CSS pipeline) and the newer line under
  # @size-limit/esbuild, none of which is published with a package.
  #
  # Both closed at the top. postcss `require()`s nanoid, so an open `>=3.3.18`
  # resolves to the ESM-only 6.x line it cannot load; the same bound is kept on the
  # other entry for the same reason rather than because 6.x is known to break it.
  # Drop the first once postcss depends on >=3.3.18 itself.
  "nanoid@<3.3.18": ">=3.3.18 <4.0.0"
  "nanoid@>=4.0.0 <5.1.16": ">=5.1.16 <6.0.0"
  "brace-expansion@>=3.0.0 <5.0.9": ">=5.0.9 <6.0.0"

  # The widening described above the js-yaml pins, for the seventh time on this
  # package: the tree resolved 3.1.8 and four more advisories move the patched
  # range to >=3.1.9. GHSA-w74x-v6f9-j3xg (URI scheme spoofing via
  # percent-encoded scheme decoding), GHSA-xhq7-xmqj-769h (improper path
  # equivalence in relative reference normalization) and GHSA-333x-w4r6-6crp
  # (scheme injection via an unescaped first-segment colon) cover the whole 3.x
  # line; GHSA-wjr9-j795-jxcr (host confusion via unchecked WHATWG host
  # canonicalization) starts at 3.1.3. All of it still arrives under `ajv` —
  # commitlint's config validator and, in the docs site, the YAML language
  # server — so nothing here parses a URI an outsider controls.
  #
  # This one key replaces the six fast-uri entries that preceded it. Each was
  # written at the floor of its day and every one of them is a subset of this
  # range, so they only obscured which bound was actually in force. Two of them
  # (`<=3.1.0`, `<=3.1.1`) also reached below 3.0.0; nothing in the tree
  # resolves a 2.x fast-uri, and the closed lower bound matches the rest of
  # this file.
  "fast-uri@>=3.0.0 <3.1.9": ">=3.1.9 <4.0.0"

  # The same widening again, plus two packages that had no entry yet. `next` and
  # `sharp` already had pins here; both advisories moved their patched range up,
  # so the existing floors went stale exactly as the js-yaml and fast-uri notes
  # above describe. `svgo` had only a 3.x entry — the tree moved to the 4.x line
  # once Astro started pulling it, and that line has its own advisory. `astro`
  # and `smol-toml` are new: both arrive under apps/docs, and `smol-toml` is
  # Astro's TOML frontmatter parser, so nothing here parses a document an
  # outsider controls. All build-time only, none published in a package, but
  # `audit:check` gates on high and these are high or critical.
  #
  # Closed upper bounds per major, matching every other entry in this file.
  "astro@<7.2.8": ">=7.2.8 <8.0.0"
  "smol-toml@<=1.7.0": ">=1.7.1 <2.0.0"
  "svgo@>=4.0.0 <4.1.0": ">=4.1.0 <5.0.0"
  "sharp@<0.35.4": ">=0.35.4 <0.36.0"
  "next@>=16.0.0 <16.3.3": ">=16.3.3 <17.0.0"

  # GHSA-73wf-gq98-2v4g / GHSA-c83g-rgw3-j3cx: browserslist resolved to 4.28.1
  # and both advisories patch at 4.28.7. It is build-time only — the CSS
  # pipeline's target resolution, never shipped in a published package — but
  # `audit:check` gates on high and these are high.
  "browserslist@<=4.28.6": ">=4.28.7 <5.0.0"

  # GHSA-9rgm-9g3h-6x36: devalue <5.9.1 can be driven into a denial of service
  # by malformed input to `parse`/`unflatten`; 5.9.2 is the first patched
  # release. Reached only through Astro, which declares `^5.8.1` -- still
  # true of the latest astro -- so no bump here reaches it. Moderate, so
  # `audit:check` does not gate on it, but it is an open Dependabot alert.
  # Closed below 6 so it stays on the line Astro declares. Drop this once Astro
  # depends on >=5.9.2 itself.
  "devalue@<5.9.2": ">=5.9.2 <6.0.0"

  # GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm and
  # GHSA-xjj6-f33q-929c: four undici advisories — cross-origin redirect cache
  # poisoning, `tls` options dropped by `Agent`, and two denial-of-service
  # paths. They land on both live majors and the widening described above the
  # js-yaml pins happened twice over here.
  #
  # The 7.x line was the stale pin: the range entry it replaces and the two
  # `jsdom>undici` / `cheerio>undici` path pins all had 7.29.0 as their floor,
  # which is where these advisories' patched range started when they were
  # written. It has since moved to 7.30.1, so the tree resolved 7.29.1 and the
  # gate went red on a commit that only bumped unrelated dependencies. The
  # path pins above are raised with this entry; a range pin alone would not
  # beat a path-scoped selector.
  #
  # The 8.x line is new. `apps/docs > astro > unifont > undici` arrived with
  # astro 7.4.4, which is the first version here to reach undici 8 at all, so
  # there was no entry to go stale.
  #
  # Both are build-time only — jsdom is the vitest DOM environment, unifont
  # fetches webfonts while the docs site builds — and neither is shipped in a
  # published package. Closed per major, matching every other entry in this
  # file.
  "undici@>=7.0.0 <7.30.1": ">=7.30.1 <8.0.0"
  "undici@>=8.0.0 <8.12.2": ">=8.12.2 <9.0.0"

  # GHSA-g3hv-75wg-m249: minimatch amplifies a pattern's `globstar` parts into
  # exponentially many match attempts, so a short hostile glob costs CPU out of
  # all proportion to its size. The advisory covers >=7.0.0 <11.0.1 and the
  # tree resolved 10.2.6 under eslint, @eslint/config-array,
  # @typescript-eslint/typescript-estree and typedoc — every one of them
  # build-time only, matching globs this repository wrote, and none shipped in
  # a published package. `audit:check` gates on high and this is moderate, so
  # it is here for the Dependabot alert rather than for the gate.
  #
  # 11.0.1 is a major bump for those consumers, which declare ^10, and typedoc
  # does not survive it: 11 dropped `matchOne` (and `makeRe`) from the exported
  # surface, and `typedoc/dist/node-utils.js` calls `mini.matchOne`, so the
  # docs build dies with `TypeError: mini.matchOne is not a function`. The path
  # pin below holds typedoc on the 10.x line and beats the range pin, the same
  # way the `jsdom>undici` pins do. eslint, @eslint/config-array and
  # @typescript-eslint/typescript-estree are fine on 11 — `pnpm run lint` is
  # green with it.
  #
  # So typedoc's copy stays on 10.2.6 and GHSA-g3hv-75wg-m249 stays open
  # against it. That is the honest trade: the alternative is pinning typedoc
  # back or dropping it, and the exposure is a glob pattern this repository
  # wrote being matched against its own source tree while generating API docs.
  # Revisit when typedoc supports minimatch 11.
  #
  # The 3.1.5 copy under eslint-plugin-react and eslint-plugin-jsx-a11y sits
  # below the advisory's range and is left alone: minimatch 3 calls
  # `brace-expansion` directly and does not survive the jump either.
  typedoc>minimatch: ">=10.2.6 <11.0.0"
  "minimatch@>=7.0.0 <11.0.1": ">=11.0.1 <12.0.0"

  # Housekeeping, no advisory of its own. Seventeen keys above this point were
  # subsets of a later entry in this same file — the residue of the widening
  # described above the js-yaml pins, where each round appended a new floor and
  # left the old one in place. They were harmless to resolution and awful to
  # read: six overlapping fast-uri ranges and four `next` ranges made it
  # impossible to tell which bound was in force without resolving the lot by
  # hand. Removed, with the resolved version of every package named in this
  # file compared before and after to prove the tree did not move.
  #
  # One of them was not a plain subset: `brace-expansion@>=3.0.0 <5.0.8` and
  # `brace-expansion@>=4.0.0 <5.0.9` each covered a range the other did not, so
  # they collapse into `>=3.0.0 <5.0.9` rather than one dropping out. Same
  # effect on the tree — a 3.x or 4.x copy is still forced onto the patched 5.x
  # line, which is what the older of the two already did.

# No auditConfig.ignoreGhsas. The one entry that lived here, GHSA-mh99-v99m-4gvg
# (brace-expansion DoS), was reachable only through
# apps/docs > @docusaurus/core > serve-handler > minimatch@3 > brace-expansion@1.x,
# and it was unfixable because minimatch@3 calls the module directly while the
# only patched release exports an object. Dropping Docusaurus removed that path
# entirely — the tree now resolves brace-expansion@5.0.8 — so the exception is
# gone with it and the audit gate has nothing suppressed.

# pnpm 11 refuses lockfile entries published inside a 24h window — a
# supply-chain guard against freshly-published malicious releases. `@rxova/brand`
# and `@rxova/astro-ui` are our own packages from the sibling rxova/rxova-website
# repo, so the window buys nothing and would instead mean the docs site could not
# pick up a brand fix for a day. Same exclusion the use-everywhere repo carries.
# `@rxova/repo-config` and `@rxova/ts-utils` come from rxova/shared on the same
# terms: the repo tooling and the inlined runtime helpers.
# Everything third-party stays subject to the policy.
minimumReleaseAgeExclude:
  - "@rxova/brand"
  - "@rxova/astro-ui"
  - "@rxova/repo-config"
  - "@rxova/ts-utils"

# `allowBuilds` replaces pnpm 10's `onlyBuiltDependencies`. Same meaning — which
# dependencies may run install scripts — but explicit per package rather than an
# allowlist, so a new script-running dependency fails loudly instead of being
# silently skipped. Both entries are build-time only: esbuild compiles the
# packages, sharp optimises the docs images.
allowBuilds:
  esbuild: true
  sharp: true

# The advisory lookup is the one request whose result is advisory rather than
# required, and pnpm's default schedule -- a 60s fetch timeout and two retries --
# turns a registry outage into four minutes of waiting before it gives up. One
# retry and a short timeout is the right amount of patience for it. These are
# pnpm settings, so they belong here rather than being passed as flags at every
# call site; `.npmrc` would not do, as pnpm reads only npm-compatible settings
# such as `registry` and auth from there.
fetchTimeout: 15000
fetchRetries: 1
fetchRetryMintimeout: 5000
fetchRetryMaxtimeout: 10000
