packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"

overrides:
  # No exact `svgo` pin. There used to be `svgo: 3.3.3`, which silently defeated
  # the `svgo@>=3.0.0 <3.3.4` range override below — an exact pin wins, so the
  # range that exists to force >=3.3.4 never applied and the tree resolved to the
  # vulnerable 3.3.3 (GHSA-2p49-hgcm-8545, removeScripts leaves some executable
  # scripts intact). Latent under Docusaurus; live once Astro started pulling
  # svgo, and only visible because `pnpm audit` works again on pnpm 11.
  jsdom>undici: ">=7.29.0 <8.0.0"
  cheerio>undici: ">=7.29.0 <8.0.0"
  "@crxjs/vite-plugin>rollup": 2.80.0
  "picomatch@<2.3.2": ">=2.3.2 <3.0.0"
  "picomatch@>=4.0.0 <4.0.4": ">=4.0.4 <5.0.0"
  "postcss@<8.5.10": ">=8.5.10 <9.0.0"
  "fast-uri@<=3.1.0": ">=3.1.1 <4.0.0"
  "fast-uri@<=3.1.1": ">=3.1.2 <4.0.0"
  "next@>=16.0.0 <16.2.5": ">=16.2.5 <17.0.0"
  "next@>=16.0.0 <16.2.6": ">=16.2.6 <17.0.0"
  "brace-expansion@>=5.0.0 <5.0.6": ">=5.0.6 <6.0.0"
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1 <0.29.0"
  "vite@>=7.0.0 <=7.3.4": ">=7.3.5 <8.0.0"
  "undici@>=7.23.0 <7.28.0": ">=7.28.0 <8.0.0"
  "undici@>=7.0.0 <7.28.0": ">=7.28.0 <8.0.0"
  "@babel/core@<=7.29.0": ">=7.29.6 <8.0.0"
  "brace-expansion@<1.1.16": ">=1.1.16 <2.0.0"
  "brace-expansion@>=3.0.0 <5.0.8": ">=5.0.8 <6.0.0"
  "svgo@>=3.0.0 <3.3.4": ">=3.3.4 <4.0.0"
  "fast-uri@>=3.0.0 <=3.1.3": ">=3.1.4 <4.0.0"
  "sharp@<0.35.0": ">=0.35.0 <0.36.0"
  "next@>=16.0.0 <16.2.11": ">=16.2.11 <17.0.0"
  "fast-uri@>=3.0.0 <3.1.3": ">=3.1.3 <4.0.0"
  "postcss@<=8.5.11": ">=8.5.12 <9.0.0"
  # GHSA-5p4m-2wfm-xmqj: `!!omap` resolution is quadratic in the number of keys, so
  # a hostile YAML document costs CPU out of proportion to its size. It lands on
  # both live majors — the 3.x line through @manypkg's read-yaml-file under
  # changesets, the 4.x line through changesets, commitlint's cosmiconfig and
  # Astro's markdown pipeline. Every consumer here parses YAML this repo owns
  # (frontmatter, changesets, commitlint config), but `audit:check` gates on high.
  #
  # Pinned per-major because the 3.x consumers still call the pre-4.0 API, so a
  # single `>=4.3.1` would break them rather than patch them. Both bounds closed:
  # an open `>=3.15.1` resolves to 5.x.
  #
  # The floors were 3.15.0 and 4.3.0, which is where the advisory's patched ranges
  # started when these entries were written. Upstream has since widened both by one
  # patch, so the pins that fixed this went stale without any file here changing and
  # the gate went red on a commit that touched nothing related.
  "js-yaml@>=3.0.0 <3.15.1": ">=3.15.1 <4.0.0"
  "js-yaml@>=4.0.0 <4.3.1": ">=4.3.1 <5.0.0"

  # GHSA-2v37-7h3g-55p8 / GHSA-28wg-ghj8-5hjv: nanoid's fill loop never terminates
  # when a custom generator is handed a size of zero, and the non-secure generators
  # loop on a negative size. Two advisories, two live majors, and nothing in this
  # repo lets a caller near either generator: the 3.x line arrives under postcss
  # (vitest's Vite, Astro's CSS pipeline) and the newer line under
  # @size-limit/esbuild, none of which is published with a package.
  #
  # Both closed at the top. postcss `require()`s nanoid, so an open `>=3.3.18`
  # resolves to the ESM-only 6.x line it cannot load; the same bound is kept on the
  # other entry for the same reason rather than because 6.x is known to break it.
  # Drop the first once postcss depends on >=3.3.18 itself.
  "nanoid@<3.3.18": ">=3.3.18 <4.0.0"
  "nanoid@>=4.0.0 <5.1.16": ">=5.1.16 <6.0.0"
  "undici@>=7.0.0 <7.29.0": ">=7.29.0 <8.0.0"
  "fast-uri@>=3.0.0 <3.1.5": ">=3.1.5 <4.0.0"
  "brace-expansion@>=4.0.0 <5.0.9": ">=5.0.9 <6.0.0"

  # Another round of the widening described above the js-yaml pins. The
  # `fast-uri@>=3.0.0 <3.1.5` entry resolved the tree to 3.1.5, which was the
  # floor when it was written; four advisories have since moved the patched
  # range to >=3.1.6, so the pin that fixed this went stale and the gate went
  # red without any file here changing. GHSA-f65p-4m7j-42xc and
  # GHSA-jqff-g426-hqxp (host confusion via percent-encoded scheme
  # normalization) cover the whole 3.x line; GHSA-fph4-wmhf-6fwf and
  # GHSA-5jgf-p345-68v8 start at 3.1.2 and 3.1.3. All of it arrives under `ajv`
  # — commitlint's config validator and, in the docs site, the YAML language
  # server — so nothing here parses a URI an outsider controls.
  "fast-uri@>=3.0.0 <3.1.6": ">=3.1.6 <4.0.0"

  # GHSA-73wf-gq98-2v4g / GHSA-c83g-rgw3-j3cx: browserslist resolved to 4.28.1
  # and both advisories patch at 4.28.7. It is build-time only — the CSS
  # pipeline's target resolution, never shipped in a published package — but
  # `audit:check` gates on high and these are high.
  "browserslist@<=4.28.6": ">=4.28.7 <5.0.0"

# No auditConfig.ignoreGhsas. The one entry that lived here, GHSA-mh99-v99m-4gvg
# (brace-expansion DoS), was reachable only through
# apps/docs > @docusaurus/core > serve-handler > minimatch@3 > brace-expansion@1.x,
# and it was unfixable because minimatch@3 calls the module directly while the
# only patched release exports an object. Dropping Docusaurus removed that path
# entirely — the tree now resolves brace-expansion@5.0.8 — so the exception is
# gone with it and the audit gate has nothing suppressed.

# pnpm 11 refuses lockfile entries published inside a 24h window — a
# supply-chain guard against freshly-published malicious releases. `@rxova/brand`
# is our own package from the sibling rxova/brand repo, so the window buys
# nothing and would instead mean the docs site could not pick up a brand fix for
# a day. Same exclusion the use-everywhere repo carries. Everything third-party
# stays subject to the policy.
minimumReleaseAgeExclude:
  - "@rxova/brand"

# `allowBuilds` replaces pnpm 10's `onlyBuiltDependencies`. Same meaning — which
# dependencies may run install scripts — but explicit per package rather than an
# allowlist, so a new script-running dependency fails loudly instead of being
# silently skipped. Both entries are build-time only: esbuild compiles the
# packages, sharp optimises the docs images.
allowBuilds:
  esbuild: true
  sharp: true

# The advisory lookup is the one request whose result is advisory rather than
# required, and pnpm's default schedule -- a 60s fetch timeout and two retries --
# turns a registry outage into four minutes of waiting before it gives up. One
# retry and a short timeout is the right amount of patience for it. These are
# pnpm settings, so they belong here rather than being passed as flags at every
# call site; `.npmrc` would not do, as pnpm reads only npm-compatible settings
# such as `registry` and auth from there.
fetchTimeout: 15000
fetchRetries: 1
fetchRetryMintimeout: 5000
fetchRetryMaxtimeout: 10000
