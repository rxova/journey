auditConfig:
  ignoreGhsas:
    # brace-expansion DoS, reached only via
    # apps/docs > @docusaurus/core > serve-handler > minimatch@3 > brace-expansion@1.x.
    # The sole patched release is brace-expansion 5.0.8, whose CommonJS entry
    # exports { expand } rather than a callable, so minimatch@3 (which calls the
    # module directly) cannot consume it. minimatch@3.1.5 is the top of the
    # legacy-v3 line and still declares brace-expansion ^1.1.7, and newer
    # minimatch majors export an object that serve-handler cannot call either.
    # Dev-only path: `docusaurus serve` local preview, never shipped in a package.
    - GHSA-mh99-v99m-4gvg

onlyBuiltDependencies:
  - esbuild
